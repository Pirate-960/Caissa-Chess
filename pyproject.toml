[tool.poetry]
name = "Caissa-Chess"
version = "0.1.0"
description = "Generative Adversarial-Cooperative Pipeline for Aesthetically Perfect Chess"
authors = ["CAISSA Collective"]
readme = "README.md"
license = "MIT"

[tool.poetry.dependencies]
python = "^3.12"
python-chess = "^1.11.0"
openai = "^1.3.0"
requests = "^2.31.0"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
python-dotenv = "^1.0.0"
anthropic = "^0.21.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
black = "^23.0.0"
flake8 = "^6.0.0"
mypy = "^1.7.0"
ipython = "^8.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
