[tool.poetry]
name = "Caissa-Chess"
version = "0.6.0"
description = "Generative Adversarial-Cooperative Pipeline for Aesthetically Perfect Chess"
authors = ["CAISSA Collective"]
readme = "README.md"
license = "MIT"
packages = [
	{ include = "core" },
	{ include = "engine" },
	{ include = "aesthetic" },
	{ include = "export" },
	{ include = "benchmarks" }
]

[tool.poetry.dependencies]
python = ">=3.11"
python-chess = "^1.11.0"
openai = "^1.3.0"
requests = "^2.31.0"
python-dotenv = "^1.0.0"
anthropic = "^0.21.0"
tenacity = "^8.2.0"
google-generativeai = "^0.3.0"
pyyaml = "^6.0"

[tool.poetry.scripts]
caissa = "main:main"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
black = "^23.0.0"
flake8 = "^6.0.0"
mypy = "^1.7.0"
ipython = "^8.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
markers = [
    "asyncio: marks tests as async (deselect with '-m \"not asyncio\"')",
]
