[tool.poetry]
name = "caissa-chess"
version = "0.1.0"
description = "CAISSA - Aesthetic Chess Game Generator using LLMs"
authors = ["CAISSA Team"]
readme = "README.md"
packages = [{include = "core"}, {include = "engine"}, {include = "aesthetic"}, {include = "export"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
openai = ">=1.0.0"
anthropic = ">=0.20.0"
google-generativeai = ">=0.5.0"
python-chess = ">=1.10.0"
requests = ">=2.31.0"
pydantic = ">=2.0.0"
rich = ">=13.0.0"
click = ">=8.1.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
pytest-cov = ">=4.0.0"
pylint = ">=3.0.0"
black = ">=23.0.0"
mypy = ">=1.0.0"
isort = ">=5.12.0"
bandit = ">=1.7.0"
pip-audit = ">=2.6.0"

[tool.poetry.scripts]
caissa = "caissa:cli"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
