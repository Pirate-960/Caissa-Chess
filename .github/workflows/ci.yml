  # ===========================
  # PR COMMENT (on PR only)
  # ===========================
  pr-comment:
    name: PR Status Comment
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && always()
    needs: [quality, build, test, provider-tests, stockfish-tests, phase31-tests, phase32-tests, e2e-tests, imports]
    permissions:
      pull-requests: write
    
    steps:
    - name: Create PR Comment
      uses: actions/github-script@v7
      with:
        script: |
          const results = {
            quality: '${{ needs.quality.result }}',
            build: '${{ needs.build.result }}',
            test: '${{ needs.test.result }}',
            providers: '${{ needs.provider-tests.result }}',
            stockfish: '${{ needs.stockfish-tests.result }}',
            phase31: '${{ needs.phase31-tests.result }}',
            phase32: '${{ needs.phase32-tests.result }}',
            e2e: '${{ needs.e2e-tests.result }}',
            imports: '${{ needs.imports.result }}'
          };
          
          const getEmoji = (status) => {
            if (status === 'success') return '✅';
            if (status === 'failure') return '❌';
            if (status === 'skipped') return '⏭️';
            return '⚠️';
          };
          
          const coreJobs = ['quality', 'build', 'test', 'providers', 'imports'];
          const v03xJobs = ['stockfish', 'phase31', 'phase32', 'e2e'];
          
          const corePassed = coreJobs.every(k => results[k] === 'success' || results[k] === 'skipped');
          const v03xPassed = v03xJobs.every(k => results[k] === 'success' || results[k] === 'skipped');
          const allPassed = corePassed && v03xPassed;
          
          const body = `## 🤖 CAISSA CI/CD Pipeline Results (v0.3.2+)
          
          ### Core Checks
          | Check | Status |
          |-------|--------|
          | Code Quality | ${getEmoji(results.quality)} ${results.quality} |
          | Build | ${getEmoji(results.build)} ${results.build} |
          | Unit Tests | ${getEmoji(results.test)} ${results.test} |
          | Provider Tests | ${getEmoji(results.providers)} ${results.providers} |
          | Module Imports | ${getEmoji(results.imports)} ${results.imports} |
          
          ### v0.3.x Feature Tests
          | Check | Status |
          |-------|--------|
          | Stockfish Integration | ${getEmoji(results.stockfish)} ${results.stockfish} |
          | Phase 3.1 (Batch/Players/NAG) | ${getEmoji(results.phase31)} ${results.phase31} |
          | Phase 3.2 (Metrics/Benchmarks) | ${getEmoji(results.phase32)} ${results.phase32} |
          | E2E Generation | ${getEmoji(results.e2e)} ${results.e2e} |
          
          ${allPassed ? '### ✅ All checks passed! Ready for review.' : corePassed ? '### ⚠️ Core checks passed. Some v0.3.x feature tests need review.' : '### ❌ Some core checks failed. Please review the logs.'}
          
          ---
          *Automated by CAISSA CI/CD Pipeline*`;
          
          // Find existing comment
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          
          const botComment = comments.find(c => 
            c.user.type === 'Bot' && 
            c.body.includes('CAISSA CI/CD Pipeline Results')
          );
          
          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: body
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
          }
