  # ===========================
  # E2E GENERATION TESTS
  # ===========================
  e2e-tests:
    name: End-to-End Generation Tests
    runs-on: ubuntu-latest
    needs: [provider-tests, stockfish-tests]
    timeout-minutes: 15
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_DEFAULT }}
    
    - name: Install Stockfish
      run: |
        sudo apt-get update
        sudo apt-get install -y stockfish
    
    - name: Cache Poetry installation
      uses: actions/cache@v4
      with:
        path: ~/.local
        key: poetry-${{ runner.os }}-${{ env.POETRY_VERSION }}
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: ${{ env.POETRY_VERSION }}
        virtualenvs-create: true
        virtualenvs-in-project: true
    
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-e2e-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}-${{ env.CACHE_VERSION }}
        restore-keys: venv-e2e-${{ runner.os }}-
    
    - name: Install dependencies
      run: poetry install --no-interaction

    - name: Run E2E Generation Tests
      run: |
        echo "╔══════════════════════════════════════════════════════════════════╗"
        echo "║           END-TO-END GENERATION TESTS - FULL PIPELINE            ║"
        echo "╠══════════════════════════════════════════════════════════════════╣"
        echo "║  Testing complete chess game generation pipeline:                ║"
        echo "║                                                                  ║"
        echo "║    Prompt → LLM → Parse → Validate → Stockfish → Beauty Score   ║"
        echo "║                                                                  ║"
        echo "║  • Self-correction loop for illegal moves                        ║"
        echo "║  • Style-based & theme-based generation                          ║"
        echo "║  • Metrics tracking throughout pipeline                          ║"
        echo "╚══════════════════════════════════════════════════════════════════╝"
        echo ""
        poetry run pytest tests/test_e2e_generation.py \
          -v \
          --tb=short \
          --junitxml=e2e-junit.xml
    
    - name: E2E Test Summary
      if: always()
      run: |
        echo ""
        echo "┌──────────────────────────────────────────────────────────────────┐"
        echo "│              END-TO-END TEST RESULTS SUMMARY                     │"
        echo "├──────────────────────────────────────────────────────────────────┤"
        echo "│ PIPELINE STAGES TESTED                                          │"
        echo "│   ✓ Stage 1: PromptManager builds chess prompts                  │"
        echo "│   ✓ Stage 2: LLM generates game (MockProvider in CI)             │"
        echo "│   ✓ Stage 3: PGNParser extracts moves from response              │"
        echo "│   ✓ Stage 4: LegalityValidator checks each move                  │"
        echo "│   ✓ Stage 5: Self-correction loop (max 3 retries)                │"
        echo "│   ✓ Stage 6: Stockfish evaluation (if available)                 │"
        echo "│   ✓ Stage 7: BeautyEvaluator scores aesthetics                   │"
        echo "├──────────────────────────────────────────────────────────────────┤"
        echo "│ GENERATION MODES TESTED                                         │"
        echo "│   ✓ Style-based: Romantic, Classical, Hypermodern, Soviet        │"
        echo "│   ✓ Theme-based: Queen Sacrifice, King Hunt, Zugzwang            │"
        echo "│   ✓ Player-style: Tal, Fischer, Kasparov emulation               │"
        echo "│   ✓ Batch mode: Multiple games with progress tracking            │"
        echo "├──────────────────────────────────────────────────────────────────┤"
        echo "│ METRICS VALIDATED                                               │"
        echo "│   ✓ Token usage per generation                                   │"
        echo "│   ✓ Latency (time to first move, total time)                     │"
        echo "│   ✓ Success rate & retry count                                   │"
        echo "│   ✓ Beauty score distribution                                    │"
        echo "└──────────────────────────────────────────────────────────────────┘"
    
    - name: Upload E2E test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-test-results
        path: e2e-junit.xml
        retention-days: 7
    
    - name: Publish E2E Test Results
      if: always()
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        files: e2e-junit.xml
        check_name: E2E Generation Test Results

  # ===========================
  # MODULE IMPORTS & SANITY
  # ===========================
  imports:
    name: Module Import Verification
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_DEFAULT }}
    
    - name: Cache Poetry installation
      uses: actions/cache@v4
      with:
        path: ~/.local
        key: poetry-${{ runner.os }}-${{ env.POETRY_VERSION }}
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        virtualenvs-create: true
        virtualenvs-in-project: true
    
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-imports-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}-${{ env.CACHE_VERSION }}
    
    - name: Install project
      run: poetry install --no-interaction

    - name: Module Import Header
      run: |
        echo ""
        echo "╔══════════════════════════════════════════════════════════════════╗"
        echo "║           MODULE IMPORT VERIFICATION - CAISSA v0.3.2+            ║"
        echo "╠══════════════════════════════════════════════════════════════════╣"
        echo "║  Verifying all modules can be imported without errors            ║"
        echo "║  Categories: Core, Providers, Stockfish, Phase 3.1/3.2, CLI      ║"
        echo "╚══════════════════════════════════════════════════════════════════╝"
        echo ""

    - name: Verify Core Module Imports
      continue-on-error: true
      run: |
        echo "┌──────────────────────────────────────────────────────────────────┐"
        echo "│ 1/6 CORE MODULES                                                 │"
        echo "├──────────────────────────────────────────────────────────────────┤"
        poetry run python -c "import caissa; print('│   ✓ caissa.py - Main entry point                                 │')" || echo "│   ⚠ caissa.py import failed                                      │"
        poetry run python -c "from core.prompt_manager import PromptManager; print('│   ✓ PromptManager - Chess prompt generation                       │')" || echo "│   ⚠ PromptManager import failed                                  │"
        poetry run python -c "from core.generator import CaissaGenerator; print('│   ✓ CaissaGenerator - Main game generator                         │')" || echo "│   ⚠ CaissaGenerator import failed                                │"
        poetry run python -c "from engine.legality import LegalityValidator; print('│   ✓ LegalityValidator - Move validation                           │')" || echo "│   ⚠ LegalityValidator import failed                              │"
        poetry run python -c "from aesthetic.beauty_eval import BeautyEvaluator; print('│   ✓ BeautyEvaluator - Aesthetic scoring                           │')" || echo "│   ⚠ BeautyEvaluator import failed                                │"
        poetry run python -c "from export.pgn_builder import PGNBuilder; print('│   ✓ PGNBuilder - PGN file generation                              │')" || echo "│   ⚠ PGNBuilder import failed                                     │"
        echo "└──────────────────────────────────────────────────────────────────┘"
    
    - name: Verify LLM Provider Imports
      continue-on-error: true
      run: |
        echo "┌──────────────────────────────────────────────────────────────────┐"
        echo "│ 2/6 LLM PROVIDERS (6 providers)                                  │"
        echo "├──────────────────────────────────────────────────────────────────┤"
        poetry run python -c "from core.llm_provider import LLMProvider; print('│   ✓ LLMProvider - Abstract base class                             │')" || echo "│   ⚠ LLMProvider import failed                                    │"
        poetry run python -c "from core.llm_provider import OpenAIProvider; print('│   ✓ OpenAIProvider - GPT-3.5/4 integration                        │')" || echo "│   ⚠ OpenAIProvider import failed                                 │"
        poetry run python -c "from core.llm_provider import AnthropicProvider; print('│   ✓ AnthropicProvider - Claude integration                        │')" || echo "│   ⚠ AnthropicProvider import failed                              │"
        poetry run python -c "from core.llm_provider import AzureOpenAIProvider; print('│   ✓ AzureOpenAIProvider - Azure endpoint                          │')" || echo "│   ⚠ AzureOpenAIProvider import failed                            │"
        poetry run python -c "from core.llm_provider import GoogleGeminiProvider; print('│   ✓ GoogleGeminiProvider - Gemini integration                     │')" || echo "│   ⚠ GoogleGeminiProvider import failed                           │"
        poetry run python -c "from core.llm_provider import OllamaProvider; print('│   ✓ OllamaProvider - Local LLM support                            │')" || echo "│   ⚠ OllamaProvider import failed                                 │"
        poetry run python -c "from core.llm_provider import MockProvider; print('│   ✓ MockProvider - Testing & CI                                   │')" || echo "│   ⚠ MockProvider import failed                                   │"
        echo "└──────────────────────────────────────────────────────────────────┘"

    - name: Verify Stockfish Engine Imports (v0.3.0)
      continue-on-error: true
      run: |
        echo "┌──────────────────────────────────────────────────────────────────┐"
        echo "│ 3/6 STOCKFISH ENGINE (v0.3.0)                                    │"
        echo "├──────────────────────────────────────────────────────────────────┤"
        poetry run python -c "from engine.stockfish_client import StockfishClient; print('│   ✓ StockfishClient - Engine wrapper                              │')" || echo "│   ⚠ StockfishClient import failed                                │"
        poetry run python -c "from engine.stockfish_client import EngineMode; print('│   ✓ EngineMode - Active/Passive modes                             │')" || echo "│   ⚠ EngineMode import failed                                     │"
        poetry run python -c "from engine.stockfish_client import PositionEvaluation; print('│   ✓ PositionEvaluation - Centipawn scoring                        │')" || echo "│   ⚠ PositionEvaluation import failed                             │"
        poetry run python -c "from engine.stockfish_client import MoveAnalysis; print('│   ✓ MoveAnalysis - Best move suggestions                          │')" || echo "│   ⚠ MoveAnalysis import failed                                   │"
        poetry run python -c "from engine.stockfish_client import BlunderInfo; print('│   ✓ BlunderInfo - Blunder detection                               │')" || echo "│   ⚠ BlunderInfo import failed                                    │"
        poetry run python -c "from engine.stockfish_client import SacrificeInfo; print('│   ✓ SacrificeInfo - Sacrifice detection                           │')" || echo "│   ⚠ SacrificeInfo import failed                                  │"
        echo "└──────────────────────────────────────────────────────────────────┘"

    - name: Verify Phase 3.1 Imports (Batch, Players, NAG)
      continue-on-error: true
      run: |
        echo "┌──────────────────────────────────────────────────────────────────┐"
        echo "│ 4/6 PHASE 3.1 MODULES (Batch, Players, Export)                   │"
        echo "├──────────────────────────────────────────────────────────────────┤"
        poetry run python -c "from core.batch_generator import BatchGenerator; print('│   ✓ BatchGenerator - Parallel game generation                     │')" || echo "│   ⚠ BatchGenerator import failed                                 │"
        poetry run python -c "from core.historical_players import HISTORICAL_PLAYERS; print('│   ✓ HISTORICAL_PLAYERS - 15 chess masters                         │')" || echo "│   ⚠ HISTORICAL_PLAYERS import failed                             │"
        poetry run python -c "from core.narrative_arcs import NARRATIVE_ARCS; print('│   ✓ NARRATIVE_ARCS - 7 storytelling patterns                      │')" || echo "│   ⚠ NARRATIVE_ARCS import failed                                 │"
        poetry run python -c "from export.nag_annotations import NAGAnnotation; print('│   ✓ NAGAnnotation - 50+ chess glyphs                              │')" || echo "│   ⚠ NAGAnnotation import failed                                  │"
        poetry run python -c "from export.multi_format_exporter import MultiFormatExporter; print('│   ✓ MultiFormatExporter - PGN/MD/HTML/JSON                        │')" || echo "│   ⚠ MultiFormatExporter import failed                            │"
        echo "└──────────────────────────────────────────────────────────────────┘"

    - name: Verify Phase 3.2 Metrics Imports
      continue-on-error: true
      run: |
        echo "┌──────────────────────────────────────────────────────────────────┐"
        echo "│ 5/6 PHASE 3.2 METRICS (Tokens, Cost, Latency)                    │"
        echo "├──────────────────────────────────────────────────────────────────┤"
        poetry run python -c "from core.metrics import TokenUsage; print('│   ✓ TokenUsage - Input/output token tracking                      │')" || echo "│   ⚠ TokenUsage import failed                                     │"
        poetry run python -c "from core.metrics import CostEstimate; print('│   ✓ CostEstimate - Dollar cost calculations                       │')" || echo "│   ⚠ CostEstimate import failed                                   │"
        poetry run python -c "from core.metrics import GenerationMetrics; print('│   ✓ GenerationMetrics - Per-generation stats                      │')" || echo "│   ⚠ GenerationMetrics import failed                              │"
        poetry run python -c "from core.metrics import ProviderMetrics; print('│   ✓ ProviderMetrics - Aggregated provider stats                   │')" || echo "│   ⚠ ProviderMetrics import failed                                │"
        poetry run python -c "from core.metrics import LatencyMetrics; print('│   ✓ LatencyMetrics - P50/P95/P99 percentiles                      │')" || echo "│   ⚠ LatencyMetrics import failed                                 │"
        poetry run python -c "from core.metrics import MODEL_PRICING; print('│   ✓ MODEL_PRICING - 20+ model pricing database                    │')" || echo "│   ⚠ MODEL_PRICING import failed                                  │"
        echo "└──────────────────────────────────────────────────────────────────┘"

    - name: Verify Phase 3.2+ Benchmarking Imports
      continue-on-error: true
      run: |
        echo "┌──────────────────────────────────────────────────────────────────┐"
        echo "│ 6/6 PHASE 3.2+ BENCHMARKING (Quality, History, Reports)          │"
        echo "├──────────────────────────────────────────────────────────────────┤"
        poetry run python -c "from benchmarks.provider_benchmark import ProviderBenchmark; print('│   ✓ ProviderBenchmark - Cross-provider comparison                 │')" || echo "│   ⚠ ProviderBenchmark import failed                              │"
        poetry run python -c "from benchmarks.rich_console import RichConsole, ProgressBar, Table; print('│   ✓ RichConsole/ProgressBar/Table - Terminal UI                   │')" || echo "│   ⚠ Rich Console Components import failed                        │"
        poetry run python -c "from benchmarks.quality_analyzer import QualityAnalyzer; print('│   ✓ QualityAnalyzer - Legality/tactical/aesthetic                 │')" || echo "│   ⚠ QualityAnalyzer import failed                                │"
        poetry run python -c "from benchmarks.benchmark_history import BenchmarkHistory; print('│   ✓ BenchmarkHistory - SQLite persistence                         │')" || echo "│   ⚠ BenchmarkHistory import failed                               │"
        poetry run python -c "from benchmarks.report_generator import ReportGenerator; print('│   ✓ ReportGenerator - HTML/Markdown reports                       │')" || echo "│   ⚠ ReportGenerator import failed                                │"
        echo "└──────────────────────────────────────────────────────────────────┘"
    
    - name: CLI Sanity Check
      continue-on-error: true
      run: |
        echo ""
        echo "┌──────────────────────────────────────────────────────────────────┐"
        echo "│ CLI SANITY CHECK                                                 │"
        echo "├──────────────────────────────────────────────────────────────────┤"
        poetry run python caissa.py --help > /dev/null && echo "│   ✓ caissa.py --help - Command line interface works              │" || echo "│   ⚠ CLI --help failed                                            │"
        poetry run python caissa.py info > /dev/null && echo "│   ✓ caissa.py info - System information displayed                 │" || echo "│   ⚠ CLI info failed                                              │"
        poetry run python caissa.py list-styles > /dev/null && echo "│   ✓ caissa.py list-styles - Available styles listed              │" || echo "│   ⚠ CLI list-styles failed                                       │"
        echo "└──────────────────────────────────────────────────────────────────┘"
        echo ""
        echo "╔══════════════════════════════════════════════════════════════════╗"
        echo "║              MODULE IMPORT VERIFICATION COMPLETE                 ║"
        echo "╚══════════════════════════════════════════════════════════════════╝"

