    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_DEFAULT }}
    
    - name: Install Stockfish
      run: |
        sudo apt-get update
        sudo apt-get install -y stockfish
        stockfish --version || echo "Stockfish installed"
    
    - name: Cache Poetry installation
      uses: actions/cache@v4
      with:
        path: ~/.local
        key: poetry-${{ runner.os }}-${{ env.POETRY_VERSION }}
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: ${{ env.POETRY_VERSION }}
        virtualenvs-create: true
        virtualenvs-in-project: true
    
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-stockfish-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}-${{ env.CACHE_VERSION }}
        restore-keys: venv-stockfish-${{ runner.os }}-
    
    - name: Install dependencies
      run: poetry install --no-interaction

    - name: Run Stockfish Tests
      run: |
        echo "╔══════════════════════════════════════════════════════════════════╗"
        echo "║         STOCKFISH INTEGRATION TESTS - CAISSA v0.3.0+            ║"
        echo "╠══════════════════════════════════════════════════════════════════╣"
        echo "║  Testing Stockfish chess engine integration (14 tests)          ║"
        echo "║  Engine: $(stockfish --version 2>/dev/null | head -1 || echo 'Stockfish')  ║"
        echo "╚══════════════════════════════════════════════════════════════════╝"
        echo ""
        poetry run pytest tests/test_stockfish.py \
          -v \
          --tb=short \
          --junitxml=stockfish-junit.xml
    
    - name: Stockfish Test Summary
      if: always()
      run: |
        echo ""
        echo "┌──────────────────────────────────────────────────────────────────┐"
        echo "│            STOCKFISH INTEGRATION TEST RESULTS                    │"
        echo "├──────────────────────────────────────────────────────────────────┤"
        echo "│ Category              │ Tests │ Description                     │"
        echo "├───────────────────────┼───────┼─────────────────────────────────┤"
        echo "│ Initialization        │   2   │ Active mode (engine found)      │"
        echo "│                       │       │ Passive mode (graceful fallback)│"
        echo "│ Position Evaluation   │   3   │ FEN parsing, centipawn scoring  │"
        echo "│                       │       │ Win/draw/loss probabilities     │"
        echo "│ Best Move Analysis    │   2   │ Top-N moves, principal variation│"
        echo "│ Blunder Detection     │   2   │ Threshold-based, severity score │"
        echo "│ Sacrifice Detection   │   2   │ Piece value, compensation calc  │"
        echo "│ Performance           │   2   │ LRU cache hits, depth scaling   │"
        echo "│ Cleanup               │   1   │ Context manager, thread safety  │"
        echo "├───────────────────────┴───────┴─────────────────────────────────┤"
        echo "│ Total: 14 tests │ Modes: Active/Passive │ Depth: 15 (default)  │"
        echo "└──────────────────────────────────────────────────────────────────┘"
    
    - name: Upload stockfish test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: stockfish-test-results
        path: stockfish-junit.xml
        retention-days: 7
    
    - name: Publish Stockfish Test Results
      if: always()
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        files: stockfish-junit.xml
        check_name: Stockfish Integration Test Results

